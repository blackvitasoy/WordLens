<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordLens 翻译</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1f2430; --sub:#5b6472; --line:#e6e9ee;
    --accent:#c0392b; --accent-soft:#fbeceb; --blue:#2c6fbb; --blue-soft:#eaf2fb;
    --green:#1e7a5a; --green-soft:#e7f4ee; --amber:#9a6b12; --amber-soft:#fbf1dc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;display:flex;flex-direction:column;overflow:hidden}

  .top{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:#fbfcfd}
  .inputrow{display:flex;gap:8px;align-items:center}
  #q{flex:1;height:42px;border:2px solid var(--line);border-radius:10px;background:#fff;
    padding:0 14px;font-size:16px;color:var(--ink);outline:none;transition:.15s}
  #q:focus{border-color:var(--accent)}
  #go{height:42px;padding:0 16px;border:0;border-radius:9px;background:var(--accent);color:#fff;
    font-size:14px;font-weight:600;cursor:pointer}
  #go:disabled{opacity:.5;cursor:wait}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--sub);font-size:11.5px}
  .kbd{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:4px;padding:1px 6px;font-size:11px;color:var(--sub)}
  .bar button{border:0;background:none;color:var(--sub);cursor:pointer;font-size:11.5px;padding:0}
  .bar button:hover{color:var(--blue)}

  #result{flex:1;overflow-y:auto;padding:16px}

  /* 句子翻译卡 */
  .sentence .zh-big{font-size:20px;font-weight:600;line-height:1.7;color:var(--ink);margin:4px 0 12px}
  .sentence .en-src{color:var(--sub);font-size:13.5px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .sentence .meta{font-size:11px;color:#a0a8b4;margin-top:14px}

  /* 单词卡 */
  .head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .head h1{font-size:30px;margin:0;letter-spacing:-.5px}
  .phones{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
  .phone{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
  .phone .tag{font-size:10px;font-weight:700;color:#fff;background:#9aa4b2;border-radius:4px;padding:1px 5px}
  .phone .txt{color:var(--ink);font-size:14px}
  .play{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--blue-soft);
    color:var(--blue);cursor:pointer;font-size:10px;display:grid;place-items:center;padding:0}
  .play:hover{background:var(--blue);color:#fff}
  .sec{margin-top:18px}
  .sec-title{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--sub);text-transform:uppercase;
    margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .sense{display:flex;gap:10px;margin-bottom:11px}
  .pos{flex:0 0 auto;font-style:italic;font-weight:700;color:var(--accent);font-size:13.5px;
    background:var(--accent-soft);padding:2px 8px;border-radius:6px;height:fit-content;min-width:44px;text-align:center}
  .defs{margin:0;padding:0;list-style:none}
  .defs li{position:relative;padding-left:16px;margin-bottom:3px}
  .defs li::before{content:"";position:absolute;left:2px;top:10px;width:5px;height:5px;border-radius:50%;background:#b6bec9}
  .defs .n{color:var(--sub);font-size:11px;margin-right:5px}
  .ex{padding:10px 12px;border-left:3px solid var(--blue);background:#fafbfd;border-radius:0 8px 8px 0;margin-bottom:8px}
  .ex .en{font-size:13.5px;color:var(--ink)}
  .ex .en b{color:var(--accent);font-weight:700;background:var(--accent-soft);padding:0 2px;border-radius:2px}
  .ex .zh{color:var(--sub);font-size:12.5px;margin-top:3px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag2{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--green-soft);color:var(--green);border:1px solid #d3e9dd}
  .phrase{padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
  .phrase:last-child{border-bottom:0}
  .phrase .e{font-weight:600;color:var(--blue)}
  .phrase .z{color:var(--sub)}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .kv .k{color:var(--sub)} .kv .v{font-weight:600;text-align:right}

  .empty{text-align:center;color:var(--sub);padding:50px 10px}
  .empty .big{font-size:40px;margin-bottom:8px;opacity:.45}
  .empty .tip{font-size:12px;margin-top:14px}
  .err{color:var(--accent);font-size:13px;padding:12px;background:var(--accent-soft);border-radius:8px}

  .toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(16px);
    background:#1f2430;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;
    opacity:0;pointer-events:none;transition:.2s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="top">
    <div class="inputrow">
      <input id="q" type="text" placeholder="英文单词/句子 或 中文，回车翻译" autocomplete="off" spellcheck="false">
      <button id="go">翻译</button>
    </div>
    <div class="bar">
      <span>Enter 翻译 · Esc 收起 · 热键唤起/收起（见托盘提示）</span>
      <button id="copyBtn" title="复制结果到剪贴板">复制</button>
    </div>
  </div>
  <div id="result">
    <div class="empty">
      <div class="big">🔍</div>
      <div>输入英文或中文，立即翻译</div>
      <div class="tip">英文单词：音标 · 词性 · 释义 · 例句 · 词族<br>英文句子：中译 · 中文：英译</div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const q=$('#q'), result=$('#result');
let current=null, currentText='';

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function highlight(en,word){
  const safe=esc(en);
  try{const first=word.trim().split(/\s+/)[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return first?safe.replace(new RegExp('\\b('+first+')\\b','gi'),'<b>$1</b>'):safe;}catch(e){return safe}
}
function play(url){if(!url){toast('暂无发音');return}const a=new Audio(url);a.onerror=()=>toast('发音失败');a.play()}

function renderSentence(d){
  const zh2en = d.dir === 'zh2en';
  const label = zh2en ? '中译英' : '英译中';
  result.innerHTML=`<div class="sentence">
    <div class="zh-big">${esc(d.translation)}</div>
    <div class="en-src">${esc(d.text)}</div>
    <div class="meta">${label} · ${esc(d.source||'')}${d.quality?' · 匹配度 '+Math.round(d.quality*100)+'%':''}</div>
  </div>`;
}
function renderWord(d){
  let senses=(d.senses||[]).map(s=>`<div class="sense"><div class="pos">${esc(s.pos)}</div>
    <ul class="defs">${(s.defs||[]).map((x,i)=>`<li><span class="n">${i+1}.</span>${esc(x)}</li>`).join('')}</ul></div>`).join('');
  let ex=(d.examples||[]).map(e=>`<div class="ex"><div class="en">${highlight(e.en,d.word)}</div>
    ${e.zh?`<div class="zh">${esc(e.zh)}</div>`:''}</div>`).join('');
  let phrases=(d.phrases||[]).map(x=>`<div class="phrase"><span class="e">${esc(x.en)}</span> ${x.zh?`<span class="z">${esc(x.zh)}</span>`:''}</div>`).join('');
  let wf=(d.wordforms||[]).map(x=>`<div class="kv"><span class="k">${esc(x.name)}</span><span class="v">${esc(x.value)}</span></div>`).join('');
  let der=(d.derivatives||[]).map(x=>`<div class="kv"><span class="k">${esc(x.w)} ${esc(x.pos)}</span><span class="v">${esc(x.zh)}</span></div>`).join('');
  let syn=(d.synonyms||[]).map(x=>{const w=typeof x==='string'?x:(x.w||'');const zh=typeof x==='object'?(x.zh||''):'';
    return `<span class="tag2">${esc(w)}${zh?' · '+esc(zh):''}</span>`}).join('');

  result.innerHTML=`<div class="word">
    <div class="head"><h1>${esc(d.word)}</h1></div>
    <div class="phones">
      ${d.ukphone?`<div class="phone"><span class="tag">UK</span><span class="txt">/ ${esc(d.ukphone)} /</span><button class="play" data-src="${esc(d.ukSpeech)}">▶</button></div>`:''}
      ${d.usphone?`<div class="phone"><span class="tag">US</span><span class="txt">/ ${esc(d.usphone)} /</span><button class="play" data-src="${esc(d.usSpeech)}">▶</button></div>`:''}
    </div>
    ${senses?`<div class="sec"><h2 class="sec-title">释义</h2>${senses}</div>`:''}
    ${ex?`<div class="sec"><h2 class="sec-title">双语例句</h2>${ex}</div>`:''}
    ${phrases?`<div class="sec"><h2 class="sec-title">常见搭配</h2>${phrases}</div>`:''}
    ${wf?`<div class="sec"><h2 class="sec-title">词形变化</h2>${wf}</div>`:''}
    ${der?`<div class="sec"><h2 class="sec-title">派生词</h2>${der}</div>`:''}
    ${syn?`<div class="sec"><h2 class="sec-title">同义词</h2><div class="tags">${syn}</div></div>`:''}
    ${(d._offline)?'<div class="meta" style="font-size:11px;color:var(--amber);margin-top:14px">离线词库结果</div>':''}
  </div>`;
  document.querySelectorAll('.play').forEach(b=>b.onclick=()=>play(b.dataset.src));
}

function plainText(d){
  if(d.type==='sentence') return d.text+'\n'+d.translation;
  let s=`${d.word}\n`;
  if(d.ukphone)s+=`UK /${d.ukphone}/ `;if(d.usphone)s+=`US /${d.usphone}/\n`;
  s+='\n【释义】\n';(d.senses||[]).forEach(x=>s+=`${x.pos} ${(x.defs||[]).join('；')}\n`);
  s+='\n【例句】\n';(d.examples||[]).forEach((x,i)=>s+=`${i+1}. ${x.en}\n   ${x.zh}\n`);
  if((d.phrases||[]).length){s+='\n【搭配】\n';d.phrases.forEach(x=>s+=`${x.en} ${x.zh}\n`)}
  return s;
}

async function doTranslate(){
  const text=q.value.trim();
  if(!text){q.focus();return}
  currentText=text;
  $('#go').disabled=true;
  result.innerHTML='<div class="empty">翻译中…</div>';
  try{
    const r=await fetch('/api/translate?text='+encodeURIComponent(text));
    const d=await r.json();
    if(d.error){result.innerHTML=`<div class="err">${esc(d.error)}</div>`;return}
    current=d;
    if(d.type==='sentence')renderSentence(d);else renderWord(d);
  }catch(e){result.innerHTML=`<div class="err">服务未启动，请先运行 WordLens</div>`}
  finally{$('#go').disabled=false}
}

$('#go').onclick=doTranslate;
q.onkeydown=e=>{if(e.key==='Enter')doTranslate()};
$('#copyBtn').onclick=()=>{
  if(!current){toast('暂无结果');return}
  const txt=plainText(current);
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('已复制')).catch(()=>fallback(txt));
  else fallback(txt);
};
function fallback(txt){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制')}catch(e){toast('复制失败')}ta.remove()}

// Esc 收起窗口：优先尝试 window.close，失败则通知热键进程隐藏
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    e.preventDefault();
    window.close();
    fetch('/api/hide').catch(()=>{});
    setTimeout(()=>{window.close()},200);
  }
});

// 支持外部调用预填：URL ?text=xxx
const params=new URLSearchParams(location.search);
const pre=params.get('text');
if(pre){q.value=pre;doTranslate()}
else q.focus();
</script>
</body>
</html>
